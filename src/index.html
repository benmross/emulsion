<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emulsion — Procedural Wallpaper &amp; Grain Loop Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Create grainy procedural wallpapers and seamless animated loops in your browser. No uploads, accounts, or generative AI.">
<link rel="canonical" href="https://emulsion.benmross.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Emulsion">
<meta property="og:title" content="Emulsion — Procedural Wallpaper Generator">
<meta property="og:description" content="Shape procedural fields, tone, color, grain, and motion, then export full-resolution stills or seamless loops.">
<meta property="og:url" content="https://emulsion.benmross.com/">
<meta property="og:image" content="https://emulsion.benmross.com/app.png">
<meta property="og:image:width" content="1500">
<meta property="og:image:height" content="807">
<meta property="og:image:alt" content="The Emulsion interface displaying a dark liquid-chrome procedural wallpaper">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Emulsion — Procedural Wallpaper Generator">
<meta name="twitter:description" content="Create grainy procedural wallpapers and seamless loops directly in your browser.">
<meta name="twitter:image" content="https://emulsion.benmross.com/app.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emulsion">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Emulsion","url":"https://emulsion.benmross.com/","applicationCategory":"MultimediaApplication","operatingSystem":"Any modern web browser","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":"A browser-based procedural wallpaper and seamless grain-loop generator."}</script>
<!-- @styles -->
</head>

<body>

<div class="app">
  <section class="stage">
    <header class="topbar">
      <div class="mark">
        <span class="dot" aria-hidden="true"></span>
        <h1>Emulsion</h1>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <p class="now" id="nowName"><i>plate</i> <b>Limb</b></p>
      <div class="tools">
        <button class="btn icon" id="immerse" title="Fullscreen preview" aria-label="Fullscreen preview">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 1.8H1.8V6M10 1.8h4.2V6M6 14.2H1.8V10M10 14.2h4.2V10"/>
          </svg>
        </button>
        <button class="btn" id="shuffle" title="Reshuffle the form and seed">Shuffle <kbd>R</kbd></button>
        <button class="btn primary" id="export">Export</button>
      </div>
    </header>

    <div class="plate">
      <div class="frame" id="frame">
        <canvas id="gl" width="540" height="960" role="img" aria-label="Procedurally generated wallpaper preview"></canvas>
        <div class="guides" id="guides" aria-hidden="true">
          <div class="g island"></div>
          <div class="g clock"><span>clock</span></div>
          <div class="g widgets"><span>widgets</span></div>
          <div class="g controls"><span>controls</span></div>
        </div>
        <div class="busy" id="busy" role="status" aria-live="polite">rendering full size…</div>
        <p class="caption" id="caption" aria-live="polite"><b>Limb</b><span>14 plates · tap to take over</span></p>
        <div class="hud" id="hud" role="toolbar" aria-label="Preview controls">
          <button class="hudbtn close" data-act="close" aria-label="Exit fullscreen">✕</button>
          <button class="hudbtn" data-act="fill">Fit</button>
          <button class="hudbtn" data-act="animate">Play</button>
          <button class="hudbtn" data-act="shuffle">Shuffle</button>
          <button class="hudbtn" data-act="export">Export</button>
        </div>
      </div>
    </div>

    <!-- shuffle / save / share, top right on a phone -->
    <div class="viewtools" id="viewtools">
      <button class="vbtn" id="mShuffle" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.8 4.4h2.4c1 0 1.7.5 2.3 1.3l3 4c.6.8 1.3 1.3 2.3 1.3h2.2"/>
          <path d="M1.8 11.7h2.4c1 0 1.7-.5 2.3-1.3l3-4c.6-.8 1.3-1.3 2.3-1.3h2.2"/>
          <path d="m12.3 2.7 1.9 1.7-1.9 1.7M12.3 10 14.2 11.7l-1.9 1.7"/>
        </svg>
      </button>
      <button class="vbtn" id="mSave" aria-label="Save image" title="Save image">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1.9v7.7"/>
          <path d="M4.9 6.5 8 9.6l3.1-3.1"/>
          <path d="M2.5 10.9v1.7c0 .6.4 1 1 1h9c.6 0 1-.4 1-1v-1.7"/>
        </svg>
      </button>
      <button class="vbtn" id="mShare" aria-label="Share" title="Share">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 10.2V1.9"/>
          <path d="M5.3 4.6 8 1.9l2.7 2.7"/>
          <path d="M4.9 6.6H3.5c-.6 0-1 .4-1 1v5.5c0 .6.4 1 1 1h9c.6 0 1-.4 1-1V7.6c0-.6-.4-1-1-1h-1.4"/>
        </svg>
      </button>
    </div>

    <footer class="status">
      <span><b id="stOut">—</b> output</span>
      <span class="sep">/</span>
      <span class="hide-sm"><b id="stMp">—</b> megapixels</span>
      <span class="sep hide-sm">/</span>
      <span class="hide-sm">preview <b id="stPrev">—</b></span>
      <span class="sep hide-sm">/</span>
      <span>seed <b id="stSeed">—</b></span>
      <span class="sep">/</span>
      <span><b id="stFps">still</b></span>
      <span class="msg" id="stMsg"></span>
    </footer>
  </section>

  <aside class="rail" id="rail">
    <button class="grab" id="grab" aria-label="Collapse the panel" aria-expanded="true"></button>

    <!-- one fixed-height body, whichever group is showing -->
    <div class="sheetbody" id="sheetbody">
      <!-- Recipes shows this; every other tab shows its own section -->
      <div class="peekplates" id="peekplates"></div>

      <!-- control sections are appended here -->
    </div>

    <nav class="tabs" id="tabs" aria-label="Control groups"></nav>
  </aside>
</div>

<!-- @app -->
</body>
</html>
