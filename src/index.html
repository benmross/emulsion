<title>Emulsion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emulsion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- @styles -->

<div class="app">
  <section class="stage">
    <header class="topbar">
      <div class="mark">
        <span class="dot" aria-hidden="true"></span>
        <h1>Emulsion</h1>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <p class="now" id="nowName"><i>plate</i> <b>Limb</b></p>
      <div class="tools">
        <button class="btn icon" id="immerse" title="Fullscreen preview" aria-label="Fullscreen preview">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 1.8H1.8V6M10 1.8h4.2V6M6 14.2H1.8V10M10 14.2h4.2V10"/>
          </svg>
        </button>
        <button class="btn" id="shuffle" title="Reshuffle the form and seed">Shuffle <kbd>R</kbd></button>
        <button class="btn primary" id="export">Export</button>
      </div>
    </header>

    <div class="plate">
      <div class="frame" id="frame">
        <canvas id="gl" width="540" height="960"></canvas>
        <div class="guides" id="guides" aria-hidden="true">
          <div class="g island"></div>
          <div class="g clock"><span>clock</span></div>
          <div class="g widgets"><span>widgets</span></div>
          <div class="g controls"><span>controls</span></div>
        </div>
        <div class="busy" id="busy">rendering full size…</div>
        <p class="caption" id="caption" aria-live="polite"><b>Limb</b><span>14 plates · tap to take over</span></p>
        <div class="hud" id="hud" role="toolbar" aria-label="Preview controls">
          <button class="hudbtn close" data-act="close" aria-label="Exit fullscreen">✕</button>
          <button class="hudbtn" data-act="fill">Fit</button>
          <button class="hudbtn" data-act="animate">Play</button>
          <button class="hudbtn" data-act="shuffle">Shuffle</button>
          <button class="hudbtn" data-act="export">Export</button>
        </div>
      </div>
    </div>

    <!-- shuffle / save / share, top right on a phone -->
    <div class="viewtools" id="viewtools">
      <button class="vbtn" id="mShuffle" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.8 4.4h2.4c1 0 1.7.5 2.3 1.3l3 4c.6.8 1.3 1.3 2.3 1.3h2.2"/>
          <path d="M1.8 11.7h2.4c1 0 1.7-.5 2.3-1.3l3-4c.6-.8 1.3-1.3 2.3-1.3h2.2"/>
          <path d="m12.3 2.7 1.9 1.7-1.9 1.7M12.3 10 14.2 11.7l-1.9 1.7"/>
        </svg>
      </button>
      <button class="vbtn" id="mSave" aria-label="Save image" title="Save image">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1.9v7.7"/>
          <path d="M4.9 6.5 8 9.6l3.1-3.1"/>
          <path d="M2.5 10.9v1.7c0 .6.4 1 1 1h9c.6 0 1-.4 1-1v-1.7"/>
        </svg>
      </button>
      <button class="vbtn" id="mShare" aria-label="Share" title="Share">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 10.2V1.9"/>
          <path d="M5.3 4.6 8 1.9l2.7 2.7"/>
          <path d="M4.9 6.6H3.5c-.6 0-1 .4-1 1v5.5c0 .6.4 1 1 1h9c.6 0 1-.4 1-1V7.6c0-.6-.4-1-1-1h-1.4"/>
        </svg>
      </button>
    </div>

    <footer class="status">
      <span><b id="stOut">—</b> output</span>
      <span class="sep">/</span>
      <span class="hide-sm"><b id="stMp">—</b> megapixels</span>
      <span class="sep hide-sm">/</span>
      <span class="hide-sm">preview <b id="stPrev">—</b></span>
      <span class="sep hide-sm">/</span>
      <span>seed <b id="stSeed">—</b></span>
      <span class="sep">/</span>
      <span><b id="stFps">still</b></span>
      <span class="msg" id="stMsg"></span>
    </footer>
  </section>

  <aside class="rail" id="rail">
    <button class="grab" id="grab" aria-label="Collapse the panel" aria-expanded="true"></button>

    <!-- one fixed-height body: the group's contents, or one open option -->
    <div class="sheetbody" id="sheetbody">
    <div class="pnav" id="pnav">
      <button class="pback" id="pback" type="button">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 3.2 5 8l4.8 4.8"/></svg>
        Back
      </button>
      <span class="ptitle" id="ptitle"></span>
    </div>

    <!-- the selected tab's contents: the recipe strip, or its list of options -->
    <div class="panel" id="panel">
      <div class="peekplates" id="peekplates"></div>
      <div class="optlist" id="optlist"></div>
    </div>

      <!-- control sections are appended here -->
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Control groups"></nav>
  </aside>
</div>

<!-- @app -->
