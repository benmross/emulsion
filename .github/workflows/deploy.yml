name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: node build.mjs

      # dist/index.html is committed so the repo can be opened without a build.
      # If it no longer matches src/, the commit forgot to rebuild.
      - name: Check dist is current
        run: |
          if ! git diff --quiet -- dist/index.html; then
            echo "::error::dist/index.html is stale — run 'node build.mjs' and commit the result"
            git diff --stat -- dist/index.html
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name emulsion --branch=main

      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set — built and verified, but nothing was deployed."
