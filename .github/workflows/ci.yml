name: CI

# Cloudflare Pages builds and deploys from its own Git integration.
# This workflow only guards the committed copy of the build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Build
        run: node build.mjs

      - name: Check production behavior
        run: node test.mjs

      # Committed output must match the complete site, including the PWA shell.
      # If it no longer matches src/, the commit forgot to rebuild.
      - name: Check dist is current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist/)" ]; then
            echo "::error::dist/ is stale — run 'node build.mjs' and commit the result"
            git diff --stat -- dist/
            exit 1
          fi
