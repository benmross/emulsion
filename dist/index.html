body{margin:0;background:var(--ink);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:5px}a:hover{color:var(--accent)}button{font:inherit;cursor:pointer}button,a{-webkit-tap-highlight-color:transparent}:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
header,footer{width:min(1280px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(22px,5vw,72px);gap:20px;font-size:13px;color:var(--muted)}header a{text-decoration:none}.wordmark{font:800 20px Archivo,system-ui,sans-serif;letter-spacing:-.06em;color:var(--text)}
main{max-width:1280px;margin:auto;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:50px;min-height:calc(100svh - 172px);padding:30px clamp(22px,5vw,72px) 60px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font:800 clamp(66px,8.6vw,124px)/.95 Archivo,system-ui,sans-serif;letter-spacing:-.07em;margin:20px 0 28px}.description{max-width:34ch;font-size:clamp(17px,1.6vw,20px);color:#d3c6be;line-height:1.65}.download{display:inline-flex;align-items:center;gap:12px;margin-top:20px;padding:12px 20px;border:1px solid #ffe0d24d;border-radius:999px;text-decoration:none;font-size:15px;color:var(--accent);background:#ffe0d20a}.download svg{width:18px;height:21px;fill:currentColor}.android{font-size:13px;color:var(--muted);margin-top:20px}.android a{color:var(--accent)}
.showcase{position:relative;isolation:isolate;display:grid;justify-items:center;padding:28px 22px;overflow:hidden;border:1px solid #ffe0d21a;border-radius:38px;background:#181012;box-shadow:0 32px 100px #0005}.ambient{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.6}.showcase::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 38%,#130e1130,#100b10c9)}
.phone{position:relative;width:min(258px,64vw);border:7px solid #272322;border-radius:42px;background:#090909;box-shadow:0 0 0 1px #9b8c8166,0 24px 65px #0009;overflow:hidden}.phone img{position:absolute;inset:0;width:100%;height:auto;display:block;opacity:0;transition:opacity 1.2s}.phone img:first-child{position:relative}.phone img.on{opacity:1}.gallery{display:flex;align-items:center;gap:4px;margin-top:24px;padding:4px;border:1px solid #ffffff20;border-radius:999px;background:#100d0e99}.gallery button{min-height:44px;padding:8px 17px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:12px}.gallery button[aria-pressed="true"]{color:#1c1312;background:var(--accent)}
footer{border-top:1px solid #ffffff12;padding-block:22px}footer nav{display:flex;gap:24px}.note{font-size:11px;color:#938681;margin:12px 0 0}
@media(max-width:760px){main{grid-template-columns:1fr;gap:32px;min-height:0;padding-top:24px}.intro{max-width:480px}h1{font-size:clamp(68px,17vw,110px);margin-top:12px}.description{max-width:36ch}.showcase{padding-block:28px}.phone{width:min(248px,62vw)}header{padding-block:22px}footer{flex-wrap:wrap}footer nav{gap:20px}.download{margin-top:10px}}

<body>
<header><a class="wordmark" href="/">emulsion</a><a href="https://benmross.com">Ben Ross ↗</a></header>
<main>
  <div class="intro">
    <p class="eyebrow">A wallpaper, made by you</p>
    <h1>emulsion</h1>
    <p class="description">Start with a plate. Find your color, shape the light, add a little grain. Save it for your screen.</p>
    <a class="download" href="https://apps.apple.com/app/id6809967506"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M18.7 14.9c0-3 2.5-4.5 2.6-4.5-1.4-2.1-3.6-2.4-4.4-2.4-1.9-.2-3.7 1.1-4.7 1.1S9.7 8 8.1 8C6 8 4 9.3 2.9 11.1.6 15 .2 20.5 2.5 24c1.2 1.8 2.5 3.8 4.4 3.7 1.8-.1 2.5-1.2 4.7-1.2s2.8 1.2 4.7 1.1c1.9 0 3.1-1.8 4.3-3.5 1.3-2 1.9-3.9 1.9-4-.1 0-3.8-1.5-3.8-5.2ZM15.4 5.8c1-1.3 1.8-3.1 1.6-4.8-1.5.1-3.3 1-4.4 2.2-1 1.1-1.8 2.9-1.6 4.6 1.7.1 3.3-.8 4.4-2Z"/></svg>Download for iPhone</a>
    <p class="android">On Android? <a href="/app/">Try the web app</a>.</p>
    <p class="note">Free. No accounts. Made on your device.</p>
  </div>
  <div class="showcase" aria-label="Inside the iPhone app">
    <video class="ambient" poster="/media/satin-poster.webp" muted playsinline loop preload="none" aria-hidden="true"></video>
    <div class="phone">
      <img class="on" src="/media/plates.webp" width="900" height="1956" alt="Emulsion on iPhone: Satin wallpaper and the plate picker">
      <img src="/media/color.webp" width="900" height="1956" alt="Emulsion on iPhone: wallpaper and color controls" aria-hidden="true">
      <img src="/media/grain.webp" width="900" height="1956" alt="Emulsion on iPhone: wallpaper and grain controls" aria-hidden="true">
    </div>
    <div class="gallery" role="group" aria-label="App preview">
      <button type="button" aria-pressed="true">Plates</button><button type="button" aria-pressed="false">Color</button><button type="button" aria-pressed="false">Grain</button>
    </div>
  </div>
</main>
<footer><span>Made by <a href="https://benmross.com">Ben Ross</a></span><nav aria-label="More about Emulsion"><a href="/privacy">Privacy policy</a><a href="https://github.com/benmross/emulsion">Source ↗</a></nav></footer>
<script>
(()=>{
  const images=[...document.querySelectorAll('.phone img')],buttons=[...document.querySelectorAll('.gallery button')],video=document.querySelector('video');
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let selected=0,auto=true,timer=0,visible=true;
  function select(i){selected=i;images.forEach((im,n)=>{im.classList.toggle('on',n===i);im.setAttribute('aria-hidden',String(n!==i));});buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));}
  function sync(){
    clearInterval(timer);
    if(!visible||document.hidden||motion.matches){video.pause();if(motion.matches&&video.hasAttribute('src')){video.removeAttribute('src');video.load();}return;}
    if(!video.hasAttribute('src')) video.src='/media/satin-loop.mp4';
    video.muted=true;video.play().catch(()=>{});
    if(auto) timer=setInterval(()=>select((selected+1)%images.length),5000);
  }
  buttons.forEach((b,i)=>b.addEventListener('click',()=>{auto=false;select(i);sync();}));
  motion.addEventListener('change',sync);document.addEventListener('visibilitychange',sync);
  new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;sync();}).observe(video);
})();
</script>
</body>
