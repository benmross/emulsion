<title>Emulsion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#08090A;
  --stage:#0B0C0D;
  --panel:#101113;
  --raise:#17181B;
  --line:#25272B;
  --line-soft:#1A1C1F;
  --text:#EDEBE6;
  --mute:#8B8F97;
  --dim:#5E626A;
  --gold-hi:#E9C58C;
  --gold-lo:#B98A3F;
  --gold-txt:#D6AC70;
  --gold-grad:linear-gradient(150deg,var(--gold-hi) 0%,var(--gold-lo) 100%);
  --gold-soft:rgba(198,150,74,.09);
  --gold-line:rgba(198,150,74,.32);
  --amber:var(--gold-txt);
  --amber-dim:var(--gold-line);
  --amber-ghost:var(--gold-soft);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--gold-txt);color:#0A0A0A}
:focus-visible{outline:2px solid var(--gold-txt);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 374px;height:100dvh;overflow:hidden}
.app > *{min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(120% 90% at 50% 0%,#131417 0%,var(--stage) 55%,#070809 100%);}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:14px 20px;border-bottom:1px solid var(--line-soft);
  background:rgba(8,9,10,.6);backdrop-filter:blur(6px);
}
.mark{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mark .dot{
  width:13px;height:13px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 34% 29%,#F7F5F0 0%,#9EA2A8 34%,#3A3D42 70%,#0E1013 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 0 13px rgba(255,255,255,.13);
}
.mark h1{
  font-family:Syne,sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.012em;
  line-height:1;margin:0;color:var(--text);
}
.rule{width:1px;height:15px;background:var(--line);flex:0 0 auto}
.recipes{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--mute);
  padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;
  font-size:12px;letter-spacing:.01em;transition:.15s border-color,.15s color,.15s background;
}
.chip{position:relative}
.chip:hover{color:var(--text);border-color:#34373C}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:transparent;color:var(--gold-txt)}
.chip[aria-pressed="true"]::after,
.shapes button[aria-pressed="true"]::after,
.pal[aria-pressed="true"]::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--gold-grad);opacity:.8;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.now{
  flex:1 1 auto;min-width:0;margin:0;display:flex;align-items:center;gap:7px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;
}
.now i{color:var(--dim);font-style:normal}
.now b{
  font-weight:400;background:var(--gold-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tools{display:flex;gap:8px;flex:0 0 auto}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--raise);color:var(--text);
  padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;
  transition:.15s background,.15s border-color,.15s transform;
}
.btn:hover{background:#1E1F23;border-color:#34373C}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:var(--gold-grad);border-color:transparent;color:#181206;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{padding:8px 9px;line-height:0}
.btn,.chip,.tab,.hudbtn,.seg button,.switch{-webkit-tap-highlight-color:transparent}
.btn kbd{
  font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px;
}

/* ---------- canvas stage ---------- */
.plate{
  flex:1 1 auto;display:grid;place-items:center;padding:26px;min-height:0;position:relative;
  background-image:linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px);
  background-size:44px 44px;
}
.frame{
  position:relative;max-width:100%;max-height:100%;
  border-radius:12px;overflow:hidden;line-height:0;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 40px 90px -30px #000,0 0 0 1px rgba(0,0,0,.6),0 2px 40px rgba(0,0,0,.7);
}
canvas#gl{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.guides{position:absolute;inset:0;display:none;pointer-events:none;line-height:1}
.frame.guided .guides{display:block}
.guides .g{position:absolute;border:1px dashed rgba(198,150,74,.36);border-radius:5px}
.guides .g span{
  position:absolute;left:5px;top:3px;font-family:"JetBrains Mono",monospace;font-size:8px;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(214,172,112,.72);
}
.guides .island{left:34.5%;right:34.5%;top:1.2%;height:4.3%;border-radius:999px;background:rgba(0,0,0,.5)}
.guides .clock{left:8%;right:8%;top:9.5%;height:12%}
.guides .widgets{left:8%;right:8%;top:22.5%;height:5%}
.guides .controls{left:8%;right:8%;top:86%;height:8%}
.btn.wide{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pair{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:end}
.busy{
  position:absolute;inset:0;display:none;place-items:center;background:rgba(8,9,10,.72);
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-txt);
}
.busy.on{display:grid}

/* collapsing is a desktop affordance — small screens use the tab bar instead */
@media (min-width:981px){
  .sec.collapsed{padding-bottom:15px}
  .sec.collapsed .stack,
  .sec.collapsed > .hint{display:none}
}

/* ---------- fullscreen preview ---------- */
.hud{display:none}
.frame{touch-action:manipulation}
body.immersive{overflow:hidden}
body.immersive .frame{
  position:fixed;inset:0;z-index:200;max-width:none;max-height:none;
  border:0;border-radius:0;box-shadow:none;background:#000;
  display:grid;place-items:center;overflow:hidden;
}
body.immersive canvas#gl{max-width:none;max-height:none}
body.immersive .hud{
  display:flex;gap:4px;padding:5px;z-index:210;
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));
  background:rgba(12,13,15,.74);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.09);border-radius:999px;
  box-shadow:0 12px 30px -12px #000;
  transition:opacity .18s ease, transform .18s ease;
}
body.immersive.hud-off .hud{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
.hudbtn{
  border:0;background:transparent;color:var(--text);cursor:pointer;
  min-height:38px;padding:0 13px;border-radius:999px;font-size:12.5px;
}
.hudbtn:hover{background:rgba(255,255,255,.08)}
.hudbtn.on{background:var(--gold-soft);color:var(--gold-txt)}
.hudbtn.close{font-size:14px;padding:0 12px}

/* ---------- control-group tabs (mobile) ---------- */
.tabs{
  display:none;position:sticky;top:0;z-index:3;gap:6px;
  padding:10px 12px;overflow-x:auto;scrollbar-width:none;
  background:var(--panel);border-bottom:1px solid var(--line-soft);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:0 0 auto;cursor:pointer;
  border:1px solid var(--line);background:#0C0D0F;color:var(--mute);
  padding:9px 14px;border-radius:999px;font-size:13px;
}
.tab[aria-selected="true"]{background:var(--gold-soft);border-color:transparent;color:var(--gold-txt)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--gold-grad);opacity:.8;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- status ---------- */
.status{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:9px 20px;border-top:1px solid var(--line-soft);
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.status b{color:var(--mute);font-weight:400}
.status .sep{color:#2C2F34}
.status .msg{color:var(--gold-txt);margin-left:auto;text-align:right}

/* ---------- rail ---------- */
.rail{
  border-left:1px solid var(--line-soft);background:var(--panel);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px;
}
.rail::-webkit-scrollbar{width:10px}
.rail::-webkit-scrollbar-thumb{background:#212327;border:3px solid var(--panel);border-radius:99px}
.sec{border-bottom:1px solid var(--line-soft);padding:16px 18px 20px}
.sec > h2{margin:0 0 14px;font-size:inherit;font-weight:400}
.sechead{
  display:flex;align-items:center;gap:9px;width:100%;padding:0;cursor:pointer;
  background:none;border:0;text-align:left;
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);transition:color .14s;
}
.sechead:hover{color:var(--mute)}
.sechead .ico{display:flex;flex:0 0 auto;color:var(--gold-lo);opacity:.85}
.sechead .lbl{flex:0 0 auto}
.sechead .hr{flex:1 1 auto;height:1px;background:var(--line-soft)}
.sechead .chev{display:flex;flex:0 0 auto;opacity:.6;transition:transform .18s ease}
.sec.collapsed .sechead .chev{transform:rotate(-90deg)}
.stack{display:flex;flex-direction:column;gap:13px}
.row{display:flex;flex-direction:column;gap:6px}
.row .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row label{color:var(--mute);font-size:12.5px}
.row .val{
  font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--text);
  font-variant-numeric:tabular-nums;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:ew-resize;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2A2D32}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#2A2D32}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text);
  border:none;margin-top:-5px;box-shadow:0 0 0 1px #000, 0 1px 4px rgba(0,0,0,.8);transition:.12s background;
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border:none;border-radius:50%;background:var(--text);box-shadow:0 0 0 1px #000;
}
input[type=range]:hover::-webkit-slider-thumb{background:var(--gold-grad)}
input[type=range]:hover::-moz-range-thumb{background:var(--gold-lo)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#0C0D0F;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{
  border:0;background:transparent;color:var(--mute);padding:6px 4px;border-radius:6px;cursor:pointer;
  font-size:12px;transition:.14s background,.14s color;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px #2E3136}

/* shape picker */
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.shapes button{
  position:relative;padding:0;border:1px solid var(--line);background:#0C0D0F;border-radius:9px;
  overflow:hidden;cursor:pointer;aspect-ratio:3/4;transition:.15s border-color,.15s transform;
}
.shapes button:hover{border-color:#3A3D43}
.shapes button[aria-pressed="true"]{border-color:transparent}
.shapes img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.shapes span{
  position:absolute;left:0;right:0;bottom:0;padding:3px 2px 4px;
  font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.04em;text-transform:uppercase;
  color:#D6D4CF;background:linear-gradient(transparent,rgba(0,0,0,.86) 55%);text-align:center;
}
.shapes button[aria-pressed="true"] span{color:var(--gold-hi)}

/* swatches */
.ramp{display:flex;gap:8px;align-items:center}
.sw{position:relative;flex:1;height:34px;border-radius:8px;border:1px solid var(--line);overflow:hidden;cursor:pointer}
.sw input{position:absolute;inset:-6px;width:200%;height:200%;border:0;padding:0;background:none;cursor:pointer;opacity:0}
.sw .tag{
  position:absolute;left:6px;bottom:4px;font-family:"JetBrains Mono",monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);mix-blend-mode:difference;
}
.palettes{display:flex;flex-wrap:wrap;gap:5px}
.pal{
  border:1px solid var(--line);border-radius:7px;padding:4px 8px 4px 5px;background:#0C0D0F;cursor:pointer;
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);transition:.14s border-color,.14s color;
}
.pal:hover{color:var(--text);border-color:#3A3D43}
.pal{position:relative}
.pal[aria-pressed="true"]{border-color:transparent;color:var(--gold-txt)}
.pal i{width:26px;height:12px;border-radius:3px;display:block}

/* toggles */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{
  position:relative;width:38px;height:21px;border-radius:99px;background:#26282D;border:1px solid var(--line);
  cursor:pointer;transition:.16s background,.16s border-color;flex:0 0 auto;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#8B8F97;transition:.16s transform,.16s background;
}
.switch[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-line)}
.switch[aria-pressed="true"]::after{transform:translateX(17px);background:var(--gold-grad)}

/* size fields */
.dims{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field span{
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
.field input,select.sel{
  background:#0C0D0F;border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;
  font-family:"JetBrains Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums;
}
select.sel{cursor:pointer;font-family:"Instrument Sans",sans-serif;font-size:13px}
.dims .x{color:var(--dim);font-family:"JetBrains Mono",monospace;padding-top:17px}
.seedrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.hint{color:var(--dim);font-size:11.5px;line-height:1.5;margin:12px 0 0}
.hint kbd{font-family:"JetBrains Mono",monospace;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* fallback */
.nogl{max-width:38ch;margin:auto;text-align:center;color:var(--mute);line-height:1.6;font-size:13px}

@media (max-width:980px){
  /* one column: preview on top, a control sheet under it — neither scrolls the page */
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stage{min-height:0}
  .rail{
    border-left:0;border-top:1px solid var(--line);
    height:min(46dvh,430px);border-radius:14px 14px 0 0;
    box-shadow:0 -20px 44px -26px #000;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  .tabs{display:flex}

  /* one group at a time — the tab names it, so the heading goes */
  .sec{display:none;padding:14px 14px 22px}
  .sec.on{display:block}
  .sec > h2{display:none}
  .stack{gap:19px}

  .topbar{gap:10px;padding:10px 12px}
  .mark h1{font-size:15px}
  .rule,.now i,#shuffle kbd{display:none}
  .now{font-size:10px;letter-spacing:.12em}
  .plate{padding:10px;background-size:32px 32px}
  .status{gap:10px;padding:7px 12px;font-size:10px}
  .status .hide-sm{display:none}

  /* touch targets */
  .btn{padding:11px 13px;min-height:44px}
  .btn.icon{padding:11px 12px}
  .btn.wide{min-height:48px}
  .row label{font-size:14px}
  .row .val{font-size:12.5px}
  input[type=range]{height:36px;touch-action:none}
  input[type=range]::-webkit-slider-runnable-track{height:5px}
  input[type=range]::-moz-range-track{height:5px}
  input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8.5px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px}
  .chip{padding:10px 14px;font-size:13px}
  .seg button{padding:11px 4px;font-size:12.5px}
  .switch{width:46px;height:26px}
  .switch::after{width:20px;height:20px}
  .switch[aria-pressed="true"]::after{transform:translateX(20px)}
  .shapes{gap:8px}
  .sw{height:40px}
  .pal{padding:7px 11px 7px 7px;font-size:12.5px}
  /* 16px keeps iOS from zooming the page on focus */
  .field input,select.sel{padding:12px 10px;font-size:16px}
  .dims .x{padding-top:20px}
  .hint{font-size:12px}
}
@media (max-width:420px){
  .mark h1{font-size:14px}
  .now{display:none}
  .btn{padding:10px 11px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <section class="stage">
    <header class="topbar">
      <div class="mark">
        <span class="dot" aria-hidden="true"></span>
        <h1>Emulsion</h1>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <p class="now" id="nowName"><i>plate</i> <b>Limb</b></p>
      <div class="tools">
        <button class="btn icon" id="immerse" title="Fullscreen preview" aria-label="Fullscreen preview">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 1.8H1.8V6M10 1.8h4.2V6M6 14.2H1.8V10M10 14.2h4.2V10"/>
          </svg>
        </button>
        <button class="btn" id="shuffle" title="Reshuffle the form and seed">Shuffle <kbd>R</kbd></button>
        <button class="btn primary" id="export">Export</button>
      </div>
    </header>

    <div class="plate">
      <div class="frame" id="frame">
        <canvas id="gl" width="540" height="960"></canvas>
        <div class="guides" id="guides" aria-hidden="true">
          <div class="g island"></div>
          <div class="g clock"><span>clock</span></div>
          <div class="g widgets"><span>widgets</span></div>
          <div class="g controls"><span>controls</span></div>
        </div>
        <div class="busy" id="busy">rendering full size…</div>
        <div class="hud" id="hud" role="toolbar" aria-label="Preview controls">
          <button class="hudbtn close" data-act="close" aria-label="Exit fullscreen">✕</button>
          <button class="hudbtn" data-act="fill">Fit</button>
          <button class="hudbtn" data-act="animate">Play</button>
          <button class="hudbtn" data-act="shuffle">Shuffle</button>
          <button class="hudbtn" data-act="export">Export</button>
        </div>
      </div>
    </div>

    <footer class="status">
      <span><b id="stOut">—</b> output</span>
      <span class="sep">/</span>
      <span class="hide-sm"><b id="stMp">—</b> megapixels</span>
      <span class="sep hide-sm">/</span>
      <span class="hide-sm">preview <b id="stPrev">—</b></span>
      <span class="sep hide-sm">/</span>
      <span>seed <b id="stSeed">—</b></span>
      <span class="sep">/</span>
      <span><b id="stFps">still</b></span>
      <span class="msg" id="stMsg"></span>
    </footer>
  </section>

  <aside class="rail" id="rail">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Control groups"></nav>
  </aside>
</div>

<script>
"use strict";

/* ============================== renderer ============================== */
const VERT = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;


const FRAG = `#version 300 es
precision highp float;
out vec4 O;
uniform vec2 uRes; uniform float uPS, uSeed;
uniform int uShape, uTex, uInvert, uChroma;
uniform float uScale,uAngle,uSoft,uWarp,uDetail,uMottle,uPosX,uPosY;
uniform float uExp,uCon,uBlack,uGam,uVig;
uniform float uTexAmt,uTexScale;
uniform float uGrain,uGSize,uGDens,uGResp;
uniform float uBands,uBlur,uStreak,uStreakAng,uGloss;
uniform float uPhase,uMotion;
uniform vec3 uC0,uC1,uC2; uniform float uMid;

mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float vn(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i), b=h21(i+vec2(1,0)), c=h21(i+vec2(0,1)), d=h21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float s=0.0,a=0.5,t=0.0;
  for(int i=0;i<6;i++){
    float w=clamp(uDetail-float(i),0.0,1.0);
    s+=a*w*vn(p); t+=a*w;
    p=rot(0.7)*p*2.03+13.7; a*=0.55;
  }
  return s/max(t,1e-4);
}
float field(vec2 p, vec2 sv){
  float L;
  float bph = uPhase*step(0.0005,uMotion);
  if(uShape==0){
    float cx = 0.20*sin(p.y*1.7+sv.x) + 0.08*sin(p.y*3.6+sv.y);
    float hw = 0.30 + 0.10*p.y + 0.05*sin(p.y*2.6+sv.x);
    float d  = abs(p.x-cx) - max(hw,0.03);
    float m  = 1.0/(1.0+exp(clamp(d*(9.0/max(uSoft,0.03)),-40.0,40.0)));
    float lat= (p.x-cx)/max(hw,1e-3);
    L = m*mix(0.05,1.0,smoothstep(-1.25,0.85,lat));
  } else if(uShape==1){
    float u=p.x, sp=max(uSoft*0.75,0.05);
    L  = exp(-pow(max((u+0.30)/sp,0.0),1.45));
    L += 0.22*exp(-pow(abs(u+0.72)/(sp*1.3),2.0));
    L *= 0.94;
  } else if(uShape==2){
    vec2 q=p*3.0+sv;
    float w=fbm(q*0.22);
    q += (uWarp*2.2)*(vec2(w,fbm(q*0.22+7.3))-0.5);
    L = 0.5+0.5*sin((q.x*1.6+q.y*1.05+w*4.0)*max(uBands*0.5,0.25) + bph);
  } else if(uShape==3){
    vec2 q=p*vec2(1.0,0.40)*2.2+sv;
    q += uWarp*1.4*(vec2(fbm(q*0.35),fbm(q*0.35+3.1))-0.5);
    float r=0.0,a=0.6,t=0.0;
    for(int i=0;i<5;i++){
      float w=clamp(uDetail-float(i),0.0,1.0);
      r+=a*w*(1.0-abs(2.0*vn(q)-1.0)); t+=a*w;
      q=rot(0.35)*q*1.9; a*=0.5;
    }
    L=pow(clamp(r/max(t,1e-4),0.0,1.0),1.4);
  } else if(uShape==4){
    vec2 q=p*2.6+sv;
    q += uWarp*2.4*(vec2(fbm(q*0.8),fbm(q*0.8+4.2))-0.5);
    float n=fbm(q);
    float mask=smoothstep(0.80,0.06,length(p*vec2(0.90,0.75)));
    L=clamp(n*1.75*mask,0.0,1.0);
  } else if(uShape==5){
    vec2 q=p*1.9;
    float r=length(q);
    float z=sqrt(max(0.0,1.0-min(r*r,1.0)));
    vec3 n=vec3(q,z+1e-3);
    n.xy += uWarp*0.35*(vec2(fbm(q*2.2+sv),fbm(q*2.2+sv+9.1))-0.5);
    n=normalize(n);
    float lam=max(dot(n,normalize(vec3(-0.55,0.5,0.62))),0.0);
    float edge=1.0/(1.0+exp(clamp((r-1.0)*(9.0/max(uSoft,0.03)),-40.0,40.0)));
    L=pow(lam,1.35)*edge + 0.07*exp(-max(r-1.0,0.0)*4.0);
  } else if(uShape==6){
    vec2 q=p*2.0+sv;
    vec2 w1=vec2(vn(q*0.9), vn(q*0.9+vec2(5.2,1.3)))-0.5;
    vec2 w2=vec2(vn(q*1.9+3.0*w1), vn(q*1.9+3.0*w1+vec2(8.3,2.8)))-0.5;
    float f=fbm(q + uWarp*3.4*w1 + uWarp*1.6*w2);
    L=0.5+0.5*sin((f*2.0-1.0)*max(uBands,0.4)*3.14159 + bph);
  } else {
    float acc=0.0;
    vec2 wq=p*1.6+sv;
    vec2 wp=p + uWarp*0.55*(vec2(fbm(wq),fbm(wq+vec2(4.9,2.2)))-0.5);
    for(int i=0;i<5;i++){
      float fi=float(i);
      vec2 c=vec2(sin(sv.x*1.3+fi*2.13)*0.52, cos(sv.y*1.1+fi*1.71)*0.66);
      float rr=0.30+0.20*sin(sv.x*1.7+fi*3.31);
      vec2 dv=(wp-c)*vec2(1.0,0.78);
      acc += rr*rr/max(dot(dv,dv), 2e-3);
    }
    L=smoothstep(0.45,2.1,acc);
  }
  L *= mix(1.0, 0.45+1.05*fbm(p*1.5+sv*0.3), uMottle);
  return L;
}
float plate(vec2 p, vec2 sv){
  if(uBlur < 0.002) return field(p,sv);
  float r = uBlur*0.42/max(uScale,0.05);
  float a = radians(uStreakAng - uAngle);
  vec2 dir = vec2(cos(a),sin(a)), per = vec2(-dir.y,dir.x);
  float s=0.0, wt=0.0;
  for(int i=0;i<9;i++){
    float fi=float(i)+0.5;
    float ang=fi*2.39996, rad=sqrt(fi/9.0);
    vec2 k=vec2(cos(ang),sin(ang))*rad;
    vec2 off=(dir*k.x*(1.0+uStreak*6.0) + per*k.y*(1.0-0.85*uStreak))*r;
    float w=1.0-0.45*rad;
    s+=w*field(p+off,sv); wt+=w;
  }
  s+=1.7*field(p,sv); wt+=1.7;
  return s/wt;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  float asp = uRes.x/uRes.y;
  vec2 p = (uv-0.5)*vec2(asp,1.0)/max(min(asp,1.0),1e-3);
  p = rot(radians(uAngle))*p;
  p = p/max(uScale,0.05) - vec2(uPosX,uPosY);
  vec2 sv = vec2(uSeed*37.1, uSeed*-21.7);
  vec2 lp = uMotion*vec2(cos(uPhase)-1.0, sin(uPhase));
  sv += lp*1.15;
  p  += lp*0.10;

  float L = plate(p, sv);

  vec2 tp = rot(radians(uAngle+35.0))*(uv-0.5)*vec2(asp,1.0)/max(min(asp,1.0),1e-3)*max(uTexScale,0.05);
  if(uTex>0 && uTex<4){
    float t=0.0;
    if(uTex==1){
      vec2 c = fract(tp*20.0 + vec2(0.0, floor(tp.x*20.0)*0.5)) - 0.5;
      float perp  = abs(dot(c, vec2(-0.707,0.707)));
      float along = abs(dot(c, vec2( 0.707,0.707)));
      t = 1.35*smoothstep(0.15,0.03,perp)*smoothstep(0.46,0.24,along) - 0.18;
    }
    else if(uTex==2){ t = (vn(vec2(tp.x*150.0,tp.y*4.0))-0.5)*2.0; }
    else { t = sin(tp.x*40.0)*sin(tp.y*40.0)*0.85; }
    L *= 1.0 + uTexAmt*t*0.5;
  }

  L = L*exp2(uExp);
  L = clamp((L-uBlack)/max(1e-3,1.0-uBlack), 0.0, 1.0);
  L = pow(L, max(uGam,0.05));
  L = clamp((L-0.45)*uCon+0.45, 0.0, 1.0);
  if(uGloss > 0.001){
    float gw = mix(0.5,0.035,uGloss);
    L = mix(L, smoothstep(0.5-gw,0.5+gw,L), min(uGloss*1.35,1.0));
  }
  L *= mix(1.0, smoothstep(1.45,0.30,length((uv-0.5)*vec2(asp,1.0)*2.0)), uVig);
  if(uInvert==1) L = 1.0-L;
  if(uTex==4){
    vec2 c = fract(tp*100.0)-0.5;
    float rr = length(c)*1.95;
    float rad = clamp(sqrt(L),0.0,1.0)*1.02;
    float dotv = smoothstep(rad+0.16, rad-0.16, rr);
    L = mix(L, mix(dotv, L, 0.18), clamp(uTexAmt,0.0,1.0));
  }

  vec3 col = L<uMid ? mix(uC0,uC1,L/max(uMid,1e-3)) : mix(uC1,uC2,(L-uMid)/max(1.0-uMid,1e-3));

  float cell = max(uGSize*uPS, 0.35);
  vec2 gp = floor(gl_FragCoord.xy/cell);
  float n1 = h21(gp+uSeed*13.1);
  float n2 = h21(gp*1.37+vec2(91.7,17.3)+uSeed*7.3);
  float present = step(1.0-uGDens, n2);
  float lum = dot(col, vec3(0.299,0.587,0.114));
  float resp = mix(1.0, (4.0*lum*(1.0-lum))*0.95+0.12, uGResp);
  float amt = uGrain*present*resp;
  vec3 g = (uChroma==1)
    ? vec3(n1, h21(gp+vec2(5.2,8.1)+uSeed), h21(gp+vec2(19.4,3.7)+uSeed))-0.5
    : vec3(n1-0.5);
  col += g*2.0*amt;
  col += (h21(gl_FragCoord.xy+uSeed*3.0)-0.5)/255.0;
  O = vec4(clamp(col,0.0,1.0),1.0);
}`;


function hex2rgb(h){
  const n = parseInt(h.slice(1),16);
  return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
}

function makeRenderer(canvas){
  const gl = canvas.getContext("webgl2",{preserveDrawingBuffer:true,antialias:false,alpha:false});
  if(!gl) return null;
  const sh = (type,src)=>{
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const va = gl.createVertexArray(); gl.bindVertexArray(va);
  const loc = {}, U = n => (loc[n] !== undefined ? loc[n] : (loc[n]=gl.getUniformLocation(prog,n)));

  return function draw(p, w, h, ps, phase){
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
    gl.viewport(0,0,w,h);
    gl.useProgram(prog);
    gl.uniform2f(U("uRes"), w, h);
    gl.uniform1f(U("uPS"), ps);
    gl.uniform1f(U("uSeed"), p.seed);
    gl.uniform1i(U("uShape"), p.shape|0);
    gl.uniform1i(U("uTex"), p.tex|0);
    gl.uniform1i(U("uInvert"), p.invert?1:0);
    gl.uniform1i(U("uChroma"), p.chroma?1:0);
    const f = (n,v)=>gl.uniform1f(U(n), v);
    f("uScale",p.scale); f("uAngle",p.angle); f("uSoft",p.soft); f("uWarp",p.warp);
    f("uDetail",p.detail); f("uMottle",p.mottle); f("uPosX",p.posx); f("uPosY",p.posy);
    f("uExp",p.exposure); f("uCon",p.contrast); f("uBlack",p.black); f("uGam",p.gamma); f("uVig",p.vignette);
    f("uTexAmt",p.texamt); f("uTexScale",p.texscale);

    f("uBands",p.bands); f("uBlur",p.blur); f("uStreak",p.streak); f("uStreakAng",p.streakang);
    f("uGloss",p.gloss);
    f("uPhase", phase||0); f("uMotion", p.flow);
    f("uMid",p.mid);
    gl.uniform3fv(U("uC0"), hex2rgb(p.c0));
    gl.uniform3fv(U("uC1"), hex2rgb(p.c1));
    gl.uniform3fv(U("uC2"), hex2rgb(p.c2));

try { draw = makeRenderer(canvas); } catch(e){ console.error(e); }

if(!draw){
  frame.remove();
  const n = document.createElement("p");
  n.className = "nogl";
  n.textContent = "This browser can't run WebGL2, which the plate needs to draw grain. Try a current Chrome, Firefox, or Safari — or enable hardware acceleration.";
  plate.appendChild(n);
} else {
  thumbCanvas = document.createElement("canvas");
  thumbCanvas.width = 90; thumbCanvas.height = 120;
  try { drawThumb = makeRenderer(thumbCanvas); } catch(e){ drawThumb = null; }
}

const binders = [];
const syncAll = () => binders.forEach(fn => fn());

let previewScale = 1, rafId = 0, rw = 2, rh = 2;
let phase = 0, animRAF = 0, animT0 = 0, recording = false, fpsEma = 0, lastFrame = 0;
function schedule(){
  if(!draw || rafId) return;
  rafId = requestAnimationFrame(()=>{ rafId = 0; render(); });
}
function paint(){ if(draw && !recording) draw(P, rw, rh, previewScale, phase); }
const COARSE = !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
function render(){
  if(!draw || recording) return;
  const asp = P.W / P.H;
  const immersive = document.body.classList.contains("immersive");
  let dispW, dispH;
  if(immersive){
    // fill crops to the screen (how a wallpaper actually sits); fit shows the whole plate
    const vw = window.innerWidth, vh = window.innerHeight;
    dispW = P.fill ? Math.max(vw, vh*asp) : Math.min(vw, vh*asp);
    dispH = dispW / asp;
  } else {
    const box = plate.getBoundingClientRect();
    const pad = COARSE ? 22 : 52;
    const availW = Math.max(120, box.width  - pad);
    const availH = Math.max(120, box.height - pad);
    dispW = Math.min(availW, availH*asp);
    dispH = dispW / asp;
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  rw = Math.round(dispW*dpr); rh = Math.round(dispH*dpr);
  const cap = COARSE ? (P.blur > 0.02 ? 0.8e6 : 1.7e6)
                     : (P.blur > 0.02 ? 1.3e6 : 2.6e6);
  if(rw*rh > cap){ const k = Math.sqrt(cap/(rw*rh)); rw = Math.round(rw*k); rh = Math.round(rh*k); }
  if(rw > P.W){ rw = P.W; rh = P.H; }
  previewScale = rw / P.W;
  canvas.style.width  = Math.round(dispW)+"px";
  canvas.style.height = Math.round(dispH)+"px";
  rw = Math.max(rw,2); rh = Math.max(rh,2);
  paint();
  updateStatus();
}
function updateStatus(){
  document.getElementById("stOut").textContent  = P.W+" × "+P.H;
  document.getElementById("stMp").textContent   = (P.W*P.H/1e6).toFixed(1);
  document.getElementById("stPrev").textContent = Math.round(previewScale*100)+"%";
  document.getElementById("stSeed").textContent = P.seed.toFixed(4);
}
function setAnimating(on){
  P.animate = on;
  if(on){
    animT0 = performance.now(); lastFrame = animT0; fpsEma = 0;
    if(!animRAF) animRAF = requestAnimationFrame(tick);
  } else {
    if(animRAF) cancelAnimationFrame(animRAF);
    animRAF = 0; phase = 0;
    document.getElementById("stFps").textContent = "still";
    schedule();
  }
}
function tick(now){
  if(!P.animate){
    animRAF = 0; phase = 0;
    document.getElementById("stFps").textContent = "still";
    schedule();
    return;
  }
  animRAF = requestAnimationFrame(tick);
  if(recording) return;
  const loopMs = Math.max(P.looplen,0.5)*1000;
  phase = (((now - animT0) % loopMs)/loopMs)*Math.PI*2;
  paint();
  const dt = now - lastFrame; lastFrame = now;
  if(dt > 0) fpsEma = fpsEma ? fpsEma*0.9 + (1000/dt)*0.1 : 1000/dt;
  document.getElementById("stFps").textContent = Math.round(fpsEma)+" fps";
}

/* ============================== offline video ==============================
   MediaRecorder timestamps frames by wall clock: a plate that renders at 14 fps
   becomes a 14 fps video, however long the loop is meant to be. Here every frame
   is rendered at its exact loop phase, handed to a VideoEncoder with an exact
   timestamp, and muxed into an MP4 by hand — so render speed affects how long
   the export takes and nothing else.

   MP4 rather than WebM because this file's destination is an iPhone, which
   plays neither WebM nor VP9.
*/

const AVC_CODECS = [
  "avc1.640034", "avc1.4D4034", "avc1.640033",
  "avc1.4D4033", "avc1.42E034", "avc1.640028"
];

function canEncodeVideo(){
  return typeof VideoEncoder !== "undefined" && typeof VideoFrame !== "undefined";
}

async function pickAvcConfig(width, height, bitrate, fps){
  if(!canEncodeVideo()) return null;
  for(const codec of AVC_CODECS){
    const cfg = {codec, width, height, bitrate, framerate: fps, avc:{format:"avc"}};
    try {
      const probe = await VideoEncoder.isConfigSupported(cfg);
      if(probe && probe.supported) return cfg;
    } catch(e){ /* try the next profile */ }
  }
  return null;
}

/* ---------- the smallest MP4 that holds one H.264 track ---------- */
const b32 = n => [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255];
const b16 = n => [(n>>>8)&255, n&255];
const ascii = s => Array.from(s, c => c.charCodeAt(0));

function box(type, ...parts){
  const body = [].concat(...parts);
  return [...b32(body.length + 8), ...ascii(type), ...body];
}
function fullBox(type, version, flags, ...parts){
  return box(type, [version, (flags>>16)&255, (flags>>8)&255, flags&255], ...parts);
}

const MATRIX = [0x00010000,0,0, 0,0x00010000,0, 0,0,0x40000000].flatMap(b32);

function buildMoov({samples, description, width, height, fps, dataOffset}){
  const n = samples.length;
  const timescale = fps * 1000;          // exact for any integer fps
  const delta = 1000;
  const durationTicks = n * delta;
  const movieTimescale = 1000;
  const movieDuration = Math.round(n * 1000 / fps);
  const syncs = [];
  samples.forEach((s,i)=>{ if(s.key) syncs.push(i+1); });

  const avcC = box("avcC", Array.from(description));
  const avc1 = box("avc1",
    [0,0,0,0,0,0], b16(1),                       // reserved, data reference index
    b32(0),                                      // pre_defined(16) + reserved(16)
    b32(0), b32(0), b32(0),                      // pre_defined[3]
    b16(width), b16(height),
    b32(0x00480000), b32(0x00480000),            // 72 dpi
    b32(0), b16(1),                              // reserved, frame count
    new Array(32).fill(0),                       // compressor name
    b16(0x0018), b16(0xFFFF),                    // depth, pre_defined
    avcC
  );

  const stbl = box("stbl",
    fullBox("stsd", 0, 0, b32(1), avc1),
    fullBox("stts", 0, 0, b32(1), b32(n), b32(delta)),
    fullBox("stss", 0, 0, b32(syncs.length), syncs.flatMap(b32)),
    fullBox("stsc", 0, 0, b32(1), b32(1), b32(n), b32(1)),
    fullBox("stsz", 0, 0, b32(0), b32(n), samples.flatMap(s => b32(s.data.byteLength))),
    fullBox("stco", 0, 0, b32(1), b32(dataOffset))
  );

  return box("moov",
    fullBox("mvhd", 0, 0,
      b32(0), b32(0), b32(movieTimescale), b32(movieDuration),
      b32(0x00010000), b16(0x0100), b16(0), b32(0), b32(0),
      MATRIX, new Array(24).fill(0), b32(2)
    ),
    box("trak",
      fullBox("tkhd", 0, 3,
        b32(0), b32(0), b32(1), b32(0), b32(movieDuration),
        b32(0), b32(0), b16(0), b16(0), b16(0), b16(0),
        MATRIX, b32(width << 16), b32(height << 16)
      ),
      box("mdia",
        fullBox("mdhd", 0, 0, b32(0), b32(0), b32(timescale), b32(durationTicks), b16(0x55C4), b16(0)),
        fullBox("hdlr", 0, 0, b32(0), ascii("vide"), b32(0), b32(0), b32(0), ascii("EmulsionVideo\0")),
        box("minf",
          fullBox("vmhd", 0, 1, b16(0), b16(0), b16(0), b16(0)),
          box("dinf", fullBox("dref", 0, 0, b32(1), fullBox("url ", 0, 1))),
          stbl
        )
      )
    )
  );
}

function muxMP4({samples, description, width, height, fps}){
  const ftyp = box("ftyp", ascii("isom"), b32(512), ascii("isomiso2avc1mp41"));
  const mdatSize = samples.reduce((n,s)=> n + s.data.byteLength, 0) + 8;
  const dataOffset = ftyp.length + 8;
  const moov = buildMoov({samples, description, width, height, fps, dataOffset});

  const out = new Uint8Array(ftyp.length + mdatSize + moov.length);
  let at = 0;
  out.set(ftyp, at); at += ftyp.length;
  out.set([...b32(mdatSize), ...ascii("mdat")], at); at += 8;
  for(const s of samples){ out.set(s.data, at); at += s.data.byteLength; }
  out.set(moov, at);
  return new Blob([out], {type: "video/mp4"});
}

/* ---------- render every frame, encode, mux ---------- */
async function encodeLoopMP4(p, {fps, seconds, onProgress}){
  const width  = p.W - (p.W % 2);       // H.264 is 4:2:0 — both axes must be even
  const height = p.H - (p.H % 2);
  const total  = Math.max(2, Math.round(fps * seconds));
  // grain is expensive to compress, so budget generously by pixel count,
  // then clamp so the file still fits a 16 MB save
  const byPixels = Math.round(width * height * fps * 0.22);
  const byBudget = Math.round(9 * 8e6 / seconds);
  const bitrate = Math.max(2e6, Math.min(24e6, byPixels, byBudget));
  const config = await pickAvcConfig(width, height, bitrate, fps);
  if(!config) return null;

  const samples = [];
  let description = null, failed = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if(meta && meta.decoderConfig && meta.decoderConfig.description){
        description = new Uint8Array(meta.decoderConfig.description);
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({data, key: chunk.type === "key"});
    },
    error: e => { failed = e; }
  });
  encoder.configure(config);

  const frameDur = Math.round(1e6 / fps);
  const gop = Math.max(1, Math.round(fps * 2));
  for(let i = 0; i < total && !failed; i++){
    draw(p, width, height, 1, (i / total) * Math.PI * 2);
    const frame = new VideoFrame(canvas, {timestamp: Math.round(i * 1e6 / fps), duration: frameDur});
    encoder.encode(frame, {keyFrame: i % gop === 0});
    frame.close();
    if(onProgress) onProgress(i + 1, total);
    // yield so the overlay repaints, and let the encoder drain if it falls behind
    await new Promise(r => setTimeout(r, 0));
    while(encoder.encodeQueueSize > 6 && !failed){
      await new Promise(r => setTimeout(r, 8));
    }
  }
  if(failed){ try { encoder.close(); } catch(e){} throw failed; }

  await encoder.flush();
  encoder.close();
  if(!description || !samples.length) return null;
  return muxMP4({samples, description, width, height, fps});
}

/* ============================== recipes, shuffle, export ============================== */
/* Move only the keys a plate owns; anything it does not name goes back to its
   default, and everything outside LOOK is left exactly as the user set it. */
function applyRecipe(r){
  for(const k of LOOK) P[k] = (k in r.p) ? r.p[k] : DEFAULTS[k];
}

let activeRecipe = 0;
RECIPES.forEach((r,i)=>{
  const b = el("button","chip",recipeBar);
  b.type="button"; b.textContent=r.name;
  b.addEventListener("click", ()=>{
    applyRecipe(r);
    activeRecipe = i;
    syncRecipes(); syncAll(); schedule(); refreshThumbs();
  });
});
function syncRecipes(){
  recipeBar.querySelectorAll(".chip").forEach((b,i)=> b.setAttribute("aria-pressed", i===activeRecipe?"true":"false"));
  const name = activeRecipe>=0 ? RECIPES[activeRecipe].name : SHAPES[P.shape].name+" · shuffled";
  document.getElementById("nowName").innerHTML = "<i>plate</i> <b>"+name+"</b>";
}
binders.push(syncRecipes);
syncRecipes();

const rnd = (a,b)=> a + Math.random()*(b-a);
document.getElementById("shuffle").addEventListener("click", shuffle);
function shuffle(){
  P.seed   = Math.round(Math.random()*9999)/10000;
  P.angle  = Math.round(rnd(-180,180));
  P.scale  = +rnd(0.7,2.2).toFixed(2);
  P.soft   = +rnd(0.15,0.6).toFixed(3);
  P.warp   = +rnd(0.1,1.1).toFixed(2);
  P.detail = +rnd(2.5,5).toFixed(2);
  P.mottle = +rnd(0.1,0.6).toFixed(2);
  P.posx   = +rnd(-0.5,0.5).toFixed(2);
  P.posy   = +rnd(-0.4,0.4).toFixed(2);
  P.bands  = +rnd(1.2,4.5).toFixed(2);
  if(Math.random()<0.5){ P.blur = +rnd(0.05,0.5).toFixed(2); P.streak = +rnd(0,0.9).toFixed(2); P.streakang = Math.round(rnd(-180,180)); }
  else { P.blur = +rnd(0,0.12).toFixed(2); P.streak = 0; }
  activeRecipe = -1;
  syncRecipes(); syncAll(); schedule(); refreshThumbs();
}

document.addEventListener("keydown", e=>{
  const t = e.target;
  if(e.key==="Escape" && document.body.classList.contains("immersive")){ exitImmersive(); return; }
  if(t && (t.tagName==="INPUT" || t.tagName==="SELECT" || t.isContentEditable)) return;
  if(e.key==="r" || e.key==="R"){ e.preventDefault(); shuffle(); }
  if(e.key==="f" || e.key==="F"){ e.preventDefault(); toggleImmersive(); }
});

/* ---------- fullscreen preview ----------
   Real fullscreen where the browser allows it; otherwise the same thing done
   with CSS, which is the only route on iPhone (Safari refuses requestFullscreen
   on anything but a <video>) and inside a sandboxed frame. */
const hud = document.getElementById("hud");
const immerseBtn = document.getElementById("immerse");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

function enterImmersive(){
  if(document.body.classList.contains("immersive")) return;
  document.body.classList.add("immersive");
  document.body.classList.remove("hud-off");
  const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
  if(req){
    try {
      const r = req.call(frame, {navigationUI:"hide"});
      if(r && r.catch) r.catch(()=>{});
    } catch(e){ /* CSS mode carries it */ }
  }
  syncHud(); render();
}
function exitImmersive(){
  if(!document.body.classList.contains("immersive")) return;
  document.body.classList.remove("immersive","hud-off");
  if(fsEl()){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit){ try { const r = exit.call(document); if(r && r.catch) r.catch(()=>{}); } catch(e){} }
  }
  render();
}
function toggleImmersive(){
  document.body.classList.contains("immersive") ? exitImmersive() : enterImmersive();
}
immerseBtn.addEventListener("click", toggleImmersive);
document.addEventListener("fullscreenchange", ()=>{ if(!fsEl()) exitImmersive(); else render(); });

/* a tap on the plate opens it full-bleed on touch devices, and hides the HUD once there */
canvas.addEventListener("click", ()=>{
  if(document.body.classList.contains("immersive")) document.body.classList.toggle("hud-off");
  else if(COARSE) enterImmersive();
});

function syncHud(){
  const fill = hud.querySelector('[data-act="fill"]');
  const play = hud.querySelector('[data-act="animate"]');
  fill.textContent = P.fill ? "Fill" : "Fit";
  fill.classList.toggle("on", !!P.fill);
  play.textContent = P.animate ? "Pause" : "Play";
  play.classList.toggle("on", !!P.animate);
}
binders.push(syncHud);
hud.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b) return;
  e.stopPropagation();
  const act = b.dataset.act;
  if(act === "close")   exitImmersive();
  if(act === "fill"){   P.fill = !P.fill; syncHud(); render(); }
  if(act === "animate"){ setAnimating(!P.animate); syncAll(); }
  if(act === "shuffle") shuffle();
  if(act === "export")  exportStill();
});

const MIME = {png:"image/png", webp:"image/webp", jpeg:"image/jpeg"};
const QUAL = {png:undefined, webp:0.95, jpeg:0.94};
const LIMIT = 16*1024*1024;

function toBlob(type, quality){
  return new Promise(res => canvas.toBlob(b => res(b), type, quality));
}
async function saveBlob(blob, filename){
  let dl = null;
  try { if(window.claude && typeof claude.use === "function") dl = await claude.use("downloads"); } catch(e){ dl = null; }
  if(dl){
    for(let attempt=0; attempt<2; attempt++){
      try { await dl.save({filename, data:blob}); msg("saved · "+filename); return "saved"; }
      catch(err){
        const code = err && err.code;
        if(code==="rate_limited" && attempt===0){ await new Promise(r=>setTimeout(r,1500)); continue; }
        if(code==="declined"){ msg("export canceled"); return "declined"; }
        if(code==="too_large") msg("file over 16 MB — try WebP or a smaller size");
        else msg("save failed" + (err && err.message ? " · "+err.message : ""));
        return "failed";
      }
    }
    return "failed";
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
  msg("saved · "+filename);
  return "saved";
}
let exporting = false;
document.getElementById("export").addEventListener("click", exportStill);
async function exportStill(){
  if(!draw || exporting) return;
  exporting = true; recording = true;
  busy.textContent = "rendering full size…";
  busy.classList.add("on");
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    draw(P, P.W, P.H, 1, phase);
    let fmt = P.fmt;
    let blob = await toBlob(MIME[fmt], QUAL[fmt]);
    if(blob && blob.size > LIMIT && fmt === "png"){
      fmt = "webp";
      const alt = await toBlob(MIME.webp, QUAL.webp);
      if(alt && alt.size < blob.size){ blob = alt; msg("PNG exceeded 16 MB — exported as WebP"); }
    }
    if(!blob){ msg("export failed — try another format"); }
    else {
      const name = "emulsion_"+SHAPES[P.shape].name.toLowerCase()+"_"+P.W+"x"+P.H+"_"+Math.round(P.seed*10000)+"."+(fmt==="jpeg"?"jpg":fmt);
      await saveBlob(blob, name);
    }
  } catch(err){
    console.error(err);
    msg("export failed · "+(err && err.message ? err.message : "unknown error"));
  } finally {
    busy.classList.remove("on");
    exporting = false; recording = false;
    render();
  }
}

/* ---------- a set of stills, for Photo Shuffle ---------- */
setBtn.addEventListener("click", async ()=>{
  if(!draw || exporting) return;
  const n = P.setsize, keepSeed = P.seed;
  exporting = true; recording = true;
  busy.textContent = "rendering set…";
  busy.classList.add("on");
  try{
    for(let i=0;i<n;i++){
      P.seed = Math.round(Math.random()*9999)/10000;
      msg("frame "+(i+1)+" of "+n+"…");
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      draw(P, P.W, P.H, 1, phase);
      let fmt = P.fmt;
      let blob = await toBlob(MIME[fmt], QUAL[fmt]);
      if(blob && blob.size > LIMIT && fmt === "png"){
        const alt = await toBlob(MIME.webp, QUAL.webp);
        if(alt && alt.size < blob.size){ blob = alt; fmt = "webp"; }
      }
      if(!blob){ msg("export failed — try another format"); break; }
      const name = "emulsion_"+SHAPES[P.shape].name.toLowerCase()+"_"+(i+1)+"_"+Math.round(P.seed*10000)+"."+(fmt==="jpeg"?"jpg":fmt);
      const status = await saveBlob(blob, name);
      if(status === "declined"){ msg("set canceled at "+(i+1)+" of "+n); break; }
      if(status === "failed") break;
      if(i < n-1) await new Promise(r=>setTimeout(r,500));
    }
  } finally {
    P.seed = keepSeed; syncAll();
    busy.classList.remove("on");
    exporting = false; recording = false;
    render();
  }
});

/* ---------- record one seamless loop ---------- */
const VIDEO_TYPES = [
  {mime:"video/mp4;codecs=avc1.4d0028", ext:"mp4"},
  {mime:"video/mp4;codecs=avc1.42E01E", ext:"mp4"},
  {mime:"video/mp4", ext:"mp4"},
  {mime:"video/webm;codecs=vp9", ext:"webm"},
  {mime:"video/webm", ext:"webm"}
];
function pickVideo(){
  if(typeof MediaRecorder === "undefined" || !canvas.captureStream) return null;
  for(const t of VIDEO_TYPES){
    try { if(MediaRecorder.isTypeSupported(t.mime)) return t; } catch(e){}
  }
  return null;
}
const VIDEO = pickVideo();
if(!VIDEO && !canEncodeVideo()){
  recBtn.disabled = true;
  recBtn.title = "This browser can't encode video";
  recNote.textContent = "Recording needs WebCodecs or MediaRecorder — Chrome, Edge, or a current Firefox or Safari.";
}

/* How fast can this machine actually paint a frame at full size? Only the
   realtime fallback cares — the WebCodecs path is immune to it. */
function measureFps(w, h, frames){
  return new Promise(res=>{
    let i = 0; const t0 = performance.now();
    (function step(){
      draw(P, w, h, 1, (i/frames)*Math.PI*2);
      if(++i >= frames){ res(frames / ((performance.now() - t0)/1000)); return; }
      requestAnimationFrame(step);
    })();
  });
}

/* Fallback: capture the canvas in real time. Frame timing comes from the wall
   clock here, so the render has to keep up — shrink it until it can. */
async function recordRealtime(dur){
  const measured = await measureFps(P.W, P.H, 6);
  let scale = Math.min(1, Math.sqrt(Math.max(measured,1) / 26));
  scale = Math.max(0.4, Math.round(scale*20)/20);
  const w = Math.max(2, Math.round(P.W*scale/2)*2);
  const h = Math.max(2, Math.round(P.H*scale/2)*2);

  draw(P, w, h, 1, 0);
  const stream = canvas.captureStream();
  const chunks = [];
  const rec = new MediaRecorder(stream, {
    mimeType: VIDEO.mime,
    videoBitsPerSecond: Math.max(2e6, Math.min(24e6, Math.round(w*h*26*0.22), Math.round(9*8e6/dur)))
  });
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });
  rec.start();
  const t0 = performance.now();
  await new Promise(done=>{
    (function step(){
      const el = performance.now() - t0;
      draw(P, w, h, 1, (el/(dur*1000))*Math.PI*2);
      busy.textContent = "recording " + (el/1000).toFixed(1) + " / " + dur.toFixed(1) + " s";
      if(el >= dur*1000){ done(); return; }
      requestAnimationFrame(step);
    })();
  });
  rec.stop();
  await stopped;
  stream.getTracks().forEach(t => t.stop());
  return {
    blob: new Blob(chunks, {type: VIDEO.mime}),
    ext: VIDEO.ext,
    note: scale < 1 ? " · captured at " + Math.round(scale*100) + "% size to hold frame rate" : ""
  };
}

recBtn.addEventListener("click", async ()=>{
  if(!draw || exporting) return;
  const dur = Math.max(P.looplen, 1);
  exporting = true; recording = true;
  busy.textContent = "preparing…";
  busy.classList.add("on");
  try{
    let blob = null, ext = "mp4", note = "";
    if(canEncodeVideo()){
      try {
        blob = await encodeLoopMP4(P, {
          fps: P.fps, seconds: dur,
          onProgress: (i,n)=>{ busy.textContent = "frame " + i + " / " + n; }
        });
      } catch(err){ console.warn("WebCodecs encode failed, falling back", err); blob = null; }
    }
    if(!blob && VIDEO){
      const r = await recordRealtime(dur);
      blob = r.blob; ext = r.ext; note = r.note;
    }
    if(!blob){ msg("this browser could not encode the loop"); }
    else if(blob.size > LIMIT){
      msg("loop is " + (blob.size/1048576).toFixed(1) + " MB — shorten it or drop the resolution");
    } else {
      const name = "emulsion_loop_"+P.W+"x"+P.H+"_"+Math.round(P.seed*10000)+"."+ext;
      const status = await saveBlob(blob, name);
      if(status === "saved" && note) msg("saved · " + name + note);
    }
  } catch(err){
    console.error(err);
    msg("recording failed · " + (err && err.message ? err.message : "unknown error"));
  } finally {
    busy.classList.remove("on");
    busy.textContent = "rendering full size…";
    exporting = false; recording = false;
    if(P.animate) animT0 = performance.now();
    render();
  }
});

/* ============================== go ============================== */
if(draw){
  let rt = 0;
  new ResizeObserver(()=>{ clearTimeout(rt); rt = setTimeout(render, 80); }).observe(plate);
  window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(render, 80); });
  render();
  refreshThumbs();
}
